<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>eSim APK Test</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        #box {
            padding: 28px;
            border: 2px solid #555;
            border-radius: 14px;
        }
        button {
            font-size: 20px;
            padding: 12px 20px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div id="box">
        <h1>eSim APK Test</h1>
        <p id="status">HTML loaded successfully.</p>
        <button onclick="testJS()">Test JavaScript</button>
    </div>

    <script>
        function testJS() {
            document.getElementById('status').textContent =
                'HTML + JavaScript + WebView all work!';
        }
    </script>
</body>
</html>
